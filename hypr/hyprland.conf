autogenerated = 0

monitor = eDP-1, preferred, 0x0, 1
monitor = HDMI-A-2, preferred, 0x1080, 1

input { 
	kb_layout = de 
}

#exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
exec-once = firefox
exec-once = $terminal 

$mod = ALT
$terminal = foot
$fileManager = 
$menu = 

bind = $mod, RETURN, exec, foot
bind = $mod, E, exec, foot -e yazi
bind = $mod, D, exec, wofi --show drun
bind = $mod, X, killactive,
bind = $mod, Z, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mod, M, fullscreen, 0
bind = , mouse:276, fullscreen, 0
bind = $mod, O, exec, sleep 0.1 && hyprctl dispatch dpms toggle eDP-e

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod , comma, focusmonitor, l 
bind = $mod , period, focusmonitor, r

bind = $mod CTRL, H, movewindow, l
bind = $mod CTRL, L, movewindow, r
bind = $mod CTRL, K, movewindow, u
bind = $mod CTRL, J, movewindow, d

bind = $mod CTRL, Q, movetoworkspacesilent, special:minimized
bind = $mod, Q , togglespecialworkspace, minimized

bind = $mod CTRL, C, movetoworkspacesilent, special:code
bind = $mod, C, togglespecialworkspace, code
bind = $mod CTRL, F, movetoworkspacesilent, special:firefox
bind = $mod, F, togglespecialworkspace, firefox

SHIFT = $mod, Y, workspace, previous
bind = $mod CTRL, comma , movewindow, mon:eDP-1
bind = $mod CTRL, period , movewindow, mon:HDMI-A-1

bind = $mod, 1, workspace, 1 
bind = $mod, 2, workspace, 2 
bind = $mod, 3, workspace, 3 
bind = $mod, 4, workspace, 4 
bind = $mod, 5, workspace, 5 
bind = $mod CTRL, 1, movetoworkspace, 1 
bind = $mod CTRL, 2, movetoworkspace, 2 
bind = $mod CTRL, 3, movetoworkspace, 3 
bind = $mod CTRL, 4, movetoworkspace, 4 
bind = $mod CTRL, 5, movetoworkspace, 5 


general { 
	gaps_in = 0, 0, 0, 0
	gaps_out = 0, 0, 0, 0
	border_size = 1
	col.active_border = rgb(a6da95) 
	col.inactive_border = rgb(000000)
}

decoration {
	active_opacity = 0.97
	inactive_opacity = 0.85
	blur {
		enabled = false 
	} 
} 

animations { 
	enabled = true 
	bezier = focusEase, 0.05, 0.9, 0.1, 1.0

	animation = border, 1, 4, focusEase 
	animation = fadeSwitch, 1, 3, focusEase 
	animation = fadeDim, 1, 3, focusEase 
}
