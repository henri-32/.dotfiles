
autogenerated = 0

input { 
	kb_layout = de 
}

exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
preload = ~/Pictures/wallpaper/boat.jpg
wallpaper = ,~/Pictures/wallpaper/boat.jpg

$mod = SUPER
$terminal = foot
$fileManager = 
$menu = 

bind = $mod, RETURN, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, C, killactive,
bind = $mod, Z, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mod, V, togglefloating,
bind = $mod, M, fullscreen, 0
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, M, movetoworkspacesilent, special:minimized
bind = $mod, comma , togglespecialworkspace, minimized
bind = $mod, Y, workspace, previous
bind = $mod, period , movewindow, mon:HDMI-A-1 
bind = $mod, minus , movewindow, mon:HDMI-A-2
bind = $mod, 1, workspace, 1 
bind = $mod, 2, workspace, 2 
bind = $mod, 3, workspace, 3 
bind = $mod, 4, workspace, 4 
bind = $mod, 5, workspace, 5 
bind = $mod SHIFT, 1, movetoworkspace, 1 
bind = $mod SHIFT, 2, movetoworkspace, 2 
bind = $mod SHIFT, 3, movetoworkspace, 3 
bind = $mod SHIFT, 4, movetoworkspace, 4 
bind = $mod SHIFT, 5, movetoworkspace, 5 


